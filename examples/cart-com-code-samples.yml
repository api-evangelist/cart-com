summary: 'Cart.com ships no client SDK, but it does publish first-party, runnable code
  samples for the Online Store API in nine languages inside the same repository that
  holds the OpenAPI. Each language has a single-token variant (admin-console token
  on the X-AC-Auth-Token header) and, for five of them, a full OAuth 2 web-flow variant
  including the SHA256 signature step. Five representative samples are saved verbatim
  in this directory; the rest are indexed below.'
