summary: 'Alongside the server-side Online Store REST API, Cart.com ships a client-side
  JavaScript Client API for storefront themes. It is not an SDK for the REST API —
  it runs in the shopper''s browser inside the merchant''s own storefront, operates
  on the live cart and session, and is documented through a first-party samples repository
  rather than a reference site. Cart.com publishes no npm-installable element library
  and no hosted embeddable checkout components.'
