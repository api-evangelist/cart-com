  repository: https://github.com/AmeriCommerce/js-api-samples
  loader: 'No package on npm; the API is present in the storefront page context. Samples
    are organised one per directory under src/.'
  capabilities:
  - name: Adding to cart
    description: Add an item to the cart, display the updated cart item count, and
      clear the cart.
    sample: https://github.com/AmeriCommerce/js-api-samples/tree/master/src/adding_to_cart
  - name: Updating the cart
    description: Render a full cart display and wire events to update line quantities
