- id: oauth2
  conforms: partial
  evidence: 'The Authentication guide documents an authorization-code style flow at
    /api/oauth and /api/oauth/access_token with scopes, redirect_uri and refresh tokens,
    but the token exchange is authenticated with a SHA256 signature over secret + code
    + client_id + scope + redirect_uri rather than RFC 6749 client authentication,
    and the issued token is presented on a proprietary X-AC-Auth-Token header rather
    than as a Bearer credential. The published OpenAPI declares no oauth2 securityScheme
    at all — only the apiKey scheme.'
  deviations:
