openapi: 3.2.0
info:
  title: Online Store Marketing API
  version: '1.0'
  description: Online Store API
servers:
- url: https://www.yoursite.com/api/v1
  description: ''
security:
- X-AC-Auth-Token: []
tags:
- name: Marketing
paths:
  /discount_actions:
    get:
      summary: Discount Actions
      tags:
      - Marketing
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_count:
                    type: integer
                  discount_actions:
                    type:
                    - array
                    items:
                      $ref: '#/components/schemas/discount_actions'
      operationId: get-discount_actions
      description: Gets an array of discount actions.
    post:
      summary: Create a Discount Actions
      operationId: post-discount_actions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/discount_actions'
      requestBody:
        content:
          application/json:
            schema:
              description: ''
              type: object
              properties:
                discount_method_id:
                  type: integer
                is_exclusive:
                  type: boolean
                is_strict:
                  type: boolean
                is_active:
                  type: boolean
                modifier_operation:
                  type: string
                modifier_amount:
                  type: string
                modifier_type:
                  type: string
                modifier_target:
                  type: string
                sort_order:
                  type: integer
            examples:
              Example:
                value:
                  discount_method_id: 4
                  is_exclusive: true
                  is_strict: false
                  is_active: false
                  modifier_operation: subtract
                  modifier_amount: '1'
                  modifier_type: dollars
                  modifier_target: total
                  sort_order: 0
      tags:
      - Marketing
      description: Creates a discount action.
  /discount_actions/{id}:
    parameters:
    - schema:
        type: string
      name: id
      in: path
      required: true
      description: The ID of the `discount_action`
    put:
      summary: Update a Discount Action
      operationId: put-discount_actions-id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/discount_actions'
      tags:
      - Marketing
      description: Updates a discount action.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/discount_actions'
    delete:
      summary: Delete a Discount Action
      operationId: delete-discount_actions-id
      responses:
        '200':
          description: OK
        '404':
          $ref: '#/components/responses/404'
      tags:
      - Marketing
      description: Deletes a discount action.
  /discount_methods:
    get:
      summary: Discount Methods
      tags:
      - Marketing
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_count:
                    type: integer
                  discount_methods:
                    type:
                    - array
                    items:
                      $ref: '#/components/schemas/discount_methods'
      operationId: get-discount_methods
      description: Gets an array of discount methods.
    post:
      summary: Create a Discount Method
      operationId: post-discount_methods
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/discount_methods'
      requestBody:
        content:
          application/json:
            schema:
              description: ''
              type: object
              x-examples:
                example-1:
                  name: 15 off
                  is_enabled: true
                  is_strict: false
                  use_once: false
                  expires: false
                  expires_at: ''
                  starts_at: 7/7/2021 3:23:11 PM
                  remaining_uses: null
                  notes: ''
                  is_free_shipping_discount: false
              properties:
                name:
                  type: string
                is_enabled:
                  type: boolean
                is_strict:
                  type: boolean
                use_once:
                  type: boolean
                expires:
                  type: boolean
                expires_at:
                  type: string
                starts_at:
                  type: string
                remaining_uses:
                  type: integer
                notes:
                  type: string
                is_free_shipping_discount:
                  type: boolean
                is_exclusive:
                  type: boolean
                uses:
                  type: integer
                exclude_child_items:
                  type: boolean
                exclude_subscription_renew:
                  type: boolean
            examples:
              Example:
                value:
                  name: 15 off
                  is_enabled: true
                  is_strict: false
                  use_once: false
                  expires: false
                  expires_at: ''
                  starts_at: 7/7/2021 3:23:11 PM
                  remaining_uses: 5
                  notes: ''
                  is_free_shipping_discount: false
                  is_exclusive: false
                  uses: 10
                  exclude_child_items: false
                  exclude_subscription_renew: true
      tags:
      - Marketing
      description: Creates a discount method.
