openapi: 3.2.0
info:
  title: Online Store Price Calculator Rule Modifiers API
  version: '1.0'
  description: Online Store API
servers:
- url: https://www.yoursite.com/api/v1
  description: ''
security:
- X-AC-Auth-Token: []
tags:
- name: Price Calculator Rule Modifiers
paths:
  /price_calculator_rule_modifiers:
    get:
      summary: Get Price Calculator Rule Modifiers
      tags:
      - Price Calculator Rule Modifiers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_count:
                    type: integer
                  price_calculator_rule_modifiers:
                    type: array
                    items:
                      $ref: '#/components/schemas/price_calculator_rule_modifiers'
      operationId: get-price_calculator_rule_modifiers
      description: Gets an array of price calculator rule modifiers.
    post:
      summary: Create a Price Calculator Rule Modifier
      operationId: post-price_calculator_rule_modifiers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/price_calculator_rule_modifiers'
      tags:
      - Price Calculator Rule Modifiers
      description: Create a Price Calculator Rule Modifiers
      requestBody:
        content:
          application/json:
            schema:
              description: ''
              type: object
              x-examples:
                example-1:
                  price_calculator_rule_id: 5
                  action: Add
                  value: -2
                  modifier_type: Dollars
                  optional_value: null
                  optional_modifier_type: Dollars
                  sort_order: 0
                  description: ''
                  optional_action: None
              properties:
                price_calculator_rule_id:
                  type: integer
                action:
                  type: string
                value:
                  type: number
                modifier_type:
                  type: string
                optional_value:
                  type: number
                optional_modifier_type:
                  type: string
                sort_order:
                  type: integer
                description:
                  type: string
                optional_action:
                  type: string
              required:
              - price_calculator_rule_id
            examples:
              Example:
                value:
                  price_calculator_rule_id: 5
                  action: Add
                  value: -2
                  modifier_type: Dollars
                  optional_value: 0
                  optional_modifier_type: Dollars
                  sort_order: 0
                  description: ''
                  optional_action: None
  /price_calculator_rule_modifiers/{id}:
    parameters:
    - schema:
        type: integer
      name: id
      in: path
      required: true
      description: The ID of the `price_calculator_rule_modifier`
    put:
      summary: Update a Price Calculator Rule Modifier
      operationId: put-price_calculator_rule_modifier-id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/price_calculator_rule_modifiers'
      tags:
      - Price Calculator Rule Modifiers
      description: Updates a price calculator rule modifier.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/price_calculator_rule_modifiers'
    delete:
      summary: Delete a Price Calculator Rule Modifier
      operationId: delete-price_calculator_rule_modifier-id
      responses:
        '200':
          description: OK
        '404':
          $ref: '#/components/responses/404'
      tags:
      - Price Calculator Rule Modifiers
      description: Delete a price calculator rule modifier.
components:
  responses:
    '404':
      description: Resource Not Found
      content:
        application/json:
          schema:
            description: Not Found
            type: object
            x-examples:
              example-1:
                status_code: 404
                message: Not Found
                details: No resource found
            properties:
              status_code:
                type: number
              message:
                type: string
              details:
                type: string
          examples: {}
      headers: {}
  schemas:
    price_calculator_rule_modifiers:
      type: object
      properties:
        id:
          type: integer
        price_calculator_rule_id:
          type: integer
        action:
          type: string
        value:
          type: integer
        modifier_type:
          type: string
        optional_action:
          type: string
        optional_value:
          type: integer
        optional_modifier_type:
          type: string
        sort_order:
          type: integer
        updated_at:
          type: string
        created_at:
          type: string
        description:
          type: string
  securitySchemes:
    X-AC-Auth-Token:
      name: X-AC-Auth-Token
      type: apiKey
      in: header
