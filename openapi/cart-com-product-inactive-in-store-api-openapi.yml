openapi: 3.2.0
info:
  title: Online Store Product Inactive In Store API
  version: '1.0'
  description: Online Store API
servers:
- url: https://www.yoursite.com/api/v1
  description: ''
security:
- X-AC-Auth-Token: []
tags:
- name: Product Inactive In Store
paths:
  /product_inactive_in_store:
    get:
      summary: Get Products Inactive in Store
      tags:
      - Product Inactive In Store
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_count:
                    type: integer
                  product_inactive_in_store:
                    type: array
                    items:
                      $ref: '#/components/schemas/product_inactive_in_store'
      operationId: get-product_inactive_in_store
      description: Gets an array of products inactive in store.
    post:
      summary: Create a Product Inactive in Store
      operationId: post-product_inactive_in_store
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/product_inactive_in_store'
      tags:
      - Product Inactive In Store
      description: Marks a product inactive in store.
      requestBody:
        content:
          application/json:
            schema:
              description: ''
              type: object
              properties:
                item_id:
                  type: integer
                store_id:
                  type: integer
                customer_type_id:
                  type: integer
              required:
              - item_id
              - store_id
            examples:
              Example:
                value:
                  item_id: 12
                  store_id: 1
                  customer_type_id: 0
        description: ''
  /product_inactive_in_store/{id}:
    parameters:
    - schema:
        type: string
      name: id
      in: path
      required: true
      description: The ID of the `product_inactive_in_store`
    put:
      summary: Update a Product Inactive in Store
      operationId: put-product_inactive_in_store-id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/product_inactive_in_store'
      tags:
      - Product Inactive In Store
      description: Updates a product inactive in store.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/product_inactive_in_store'
    delete:
      summary: Delete a Product Inactive in Store
      operationId: delete-product_inactive_in_store-id
      responses:
        '200':
          description: OK
        '404':
          $ref: '#/components/responses/404'
      tags:
      - Product Inactive In Store
      description: Delete a product inactive in store.
components:
  responses:
    '404':
      description: Resource Not Found
      content:
        application/json:
          schema:
            description: Not Found
            type: object
            x-examples:
              example-1:
                status_code: 404
                message: Not Found
                details: No resource found
            properties:
              status_code:
                type: number
              message:
                type: string
              details:
                type: string
          examples: {}
      headers: {}
  schemas:
    product_inactive_in_store:
      type: object
      properties:
        id:
          type: integer
        item_id:
          type: integer
        store_id:
          type: integer
        updated_at:
          type: string
        created_at:
          type: string
        customer_type_id:
          type: integer
  securitySchemes:
    X-AC-Auth-Token:
      name: X-AC-Auth-Token
      type: apiKey
      in: header
