        customer_id:
          type: integer
        is_public:
          type: boolean
        updated_at:
          type: string
          minLength: 1
        created_at:
          type: string
          minLength: 1
        store_id:
          type: integer
        session_id:
          type: integer
        discount_total:
          type: number
        subtotal:
          type: number
        shipping_total:
          type: number
