openapi: 3.2.0
info:
  title: Online Store Cart Items API
  version: '1.0'
  description: Online Store API
servers:
- url: https://www.yoursite.com/api/v1
  description: ''
security:
- X-AC-Auth-Token: []
tags:
- name: Cart Items
paths:
  /cart_items:
    get:
      summary: Get Cart Items
      tags:
      - Cart Items
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_count:
                    type:
                    - string
                    - integer
                  cart_items:
                    type:
                    - array
                    items:
                      $ref: '#/components/schemas/cart_items'
            application/xml:
              schema:
                type: object
                properties:
                  total_count:
                    type:
                    - string
                    - integer
                  ? ''
                  : $ref: '#/components/schemas/cart_items'
      operationId: get-cart_items
      description: Gets an array of cart items.
    post:
      summary: Create a Cart Item
      operationId: post-cart_items
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cart_items'
      description: 'Adds an Item to specified cart. '
      requestBody:
        content:
          application/json:
            schema:
              description: ''
              type: object
              x-examples:
                example-1:
                  id: 6110
                  product_id: 8
                  item_number: 3367799-2
                  quantity: 1
                  price: 330
                  cost: 125
                  shipping_address_id: 0
                  item_thumbnail: /Shared/images/sample/products/Shirts/3367799.jpg
                  item_url: ''
                  item_name: Clayton Solid Cotton French
                  warehouse_id: 0
                  parent_product_id: null
                  parent_cart_item_id: null
                  updated_at: '2021-10-05T12:09:13.62-05:00'
                  created_at: '2021-10-05T12:08:41.37-05:00'
                  cart_id: 3946
                  is_subscription_product: false
                  vendor_store_id: null
                  variants:
                  - id: 5
                    description: 'COLOR: White'
                    variant_group_id: 4
                  - id: 7
                    description: 'SIZE: Large'
                    variant_group_id: 1
                  personalizations:
                  - id: 27
                    answer: Hello There
              properties:
                product_id:
                  type: integer
                item_number:
                  type: string
                quantity:
                  type: integer
                price:
                  type: number
                cost:
                  type: number
                shipping_address_id:
                  type: integer
                item_thumbnail:
                  type: string
                item_url:
                  type: string
                item_name:
                  type: string
                warehouse_id:
                  type: integer
                parent_product_id:
                  type: integer
                parent_cart_item_id:
                  type: integer
                cart_id:
                  type: integer
                is_subscription_product:
                  type: boolean
                configuration:
                  type: string
                subscription_paused:
                  type: boolean
                variants:
                  type: array
                  uniqueItems: false
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                      description:
                        type: string
                      variant_group_id:
                        type: integer
                personalizations:
                  type: array
                  uniqueItems: false
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                      answer:
                        type: string
              required:
              - product_id
              - cart_id
            examples:
              Example:
                value:
                  id: 6110
                  product_id: 8
                  item_number: 3367799-2
                  quantity: 1
                  price: 330
                  cost: 125
                  shipping_address_id: 0
                  item_thumbnail: /Shared/images/shirt.jpg
                  item_url: ''
                  item_name: T Shirt
                  warehouse_id: 0
                  parent_product_id: null
                  parent_cart_item_id: null
                  updated_at: '2021-10-05T12:09:13.62-05:00'
                  created_at: '2021-10-05T12:08:41.37-05:00'
                  cart_id: 3946
                  is_subscription_product: false
                  configuration: ''
                  subscription_paused: false
                  variants:
                  - id: 5
                    description: 'COLOR: White'
                    variant_group_id: 4
                  - id: 7
                    description: 'SIZE: Large'
                    variant_group_id: 1
                  personalizations:
                  - id: 27
                    answer: Hello There
      tags:
      - Cart Items
  /cart_items/{id}:
    parameters:
    - schema:
        type: integer
      name: id
      in: path
      required: true
      description: The ID of the `cart_item`
    put:
      summary: Update a Cart Item
      operationId: put-cart_items-id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cart_items'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/cart_items'
            examples:
              Example:
                value:
                  id: 6110
                  product_id: 8
                  item_number: 3367799-2
                  quantity: 1
                  price: 330
                  cost: 125
                  shipping_address_id: 0
                  item_thumbnail: /Shared/images/sample/products/Shirts/3367799.jpg
                  item_url: ''
                  item_name: Clayton Solid Cotton French
                  warehouse_id: 0
                  parent_product_id: 4
                  parent_cart_item_id: 45
                  updated_at: '2021-10-05T12:09:13.62-05:00'
                  created_at: '2021-10-05T12:08:41.37-05:00'
                  cart_id: 3946
                  is_subscription_product: false
                  configuration: ''
                  subscription_paused: false
                  variants:
                  - id: 5
                    description: 'COLOR: White'
                    variant_group_id: 4
                  - id: 7
                    description: 'SIZE: Large'
                    variant_group_id: 1
                  personalizations:
                  - id: 27
                    answer: Hello There
      description: 'Updates a cart item. '
      tags:
      - Cart Items
    delete:
      summary: Delete a Cart Item
      operationId: delete-cart_items-id
      responses:
        '200':
          description: OK
        '404':
          $ref: '#/components/responses/404'
      description: Deletes a cart item.
      tags:
      - Cart Items
components:
  responses:
    '404':
      description: Resource Not Found
      content:
        application/json:
          schema:
            description: Not Found
            type: object
            x-examples:
              example-1:
                status_code: 404
                message: Not Found
                details: No resource found
            properties:
              status_code:
                type: number
              message:
                type: string
              details:
                type: string
          examples: {}
      headers: {}
  schemas:
    cart_items:
      type: object
      properties:
        id:
          type: integer
        product_id:
          type: integer
        item_number:
          type: string
        quantity:
          type: integer
        price:
          type: number
        cost:
          type: number
        shipping_address_id:
          type: integer
        item_thumbnail:
          type: string
        item_url:
          type: string
        item_name:
          type: string
        warehouse_id:
          type: integer
        parent_product_id:
          type: integer
        parent_cart_item_id:
          type: integer
        updated_at:
          type: string
        created_at:
          type: string
        cart_id:
          type: integer
        is_subscription_product:
          type: boolean
        configuration:
          type: string
        subscription_paused:
          type: boolean
        variants:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              description:
                type: string
              variant_group_id:
                type: integer
        personalizations:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              answer:
                type: string
  securitySchemes:
    X-AC-Auth-Token:
      name: X-AC-Auth-Token
      type: apiKey
      in: header
