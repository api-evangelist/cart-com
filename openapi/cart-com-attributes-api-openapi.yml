openapi: 3.2.0
info:
  title: Online Store Attributes API
  version: '1.0'
  description: Online Store API
servers:
- url: https://www.yoursite.com/api/v1
  description: ''
security:
- X-AC-Auth-Token: []
tags:
- name: Attributes
paths:
  /attributes:
    get:
      summary: Get Attributes
      tags:
      - Attributes
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_count:
                    type: integer
                  attribues:
                    type: array
                    items:
                      $ref: '#/components/schemas/attributes'
      operationId: get-attributes
      description: Gets an array of attribtues.
    post:
      summary: Create an Attribute
      operationId: post-attributes
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/attributes'
              examples: {}
      requestBody:
        content:
          application/json:
            schema:
              description: ''
              type: object
              x-examples:
                example-1:
                  attribute_group_id: 1
                  name: White
                  is_hidden: false
                  sort_order: 0
                  updated_at: null
                  created_at: null
                  page_title: ''
                  keywords: ''
                  meta_description: ''
                  url_rewrite: ''
              properties:
                attribute_group_id:
                  type: integer
                name:
                  type: string
                is_hidden:
                  type: boolean
                sort_order:
                  type: number
                page_title:
                  type: string
                keywords:
                  type: string
                meta_description:
                  type: string
                url_rewrite:
                  type: string
              required:
              - attribute_group_id
            examples:
              Example:
                value:
                  attribute_group_id: 1
                  name: small
                  is_hidden: false
                  sort_order: 0
                  page_title: ''
                  keywords: ''
                  meta_description: ''
                  url_rewrite: ''
      description: Creates an attribute.
      tags:
      - Attributes
  /attributes/{id}:
    parameters:
    - schema:
        type: integer
      name: id
      in: path
      required: true
      description: The ID of the `attribute`
    put:
      summary: Update an Attribute
      operationId: put-attributes-id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/attributes'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/attributes'
      description: Update an attribute by ID.
      tags:
      - Attributes
    delete:
      summary: Delete an Attribute
      operationId: delete-attributes-id
      responses:
        '200':
          description: OK
        '404':
          $ref: '#/components/responses/404'
      tags:
      - Attributes
      description: Delete an attribute by ID.
components:
  responses:
    '404':
      description: Resource Not Found
      content:
        application/json:
          schema:
            description: Not Found
            type: object
            x-examples:
              example-1:
                status_code: 404
                message: Not Found
                details: No resource found
            properties:
              status_code:
                type: number
              message:
                type: string
              details:
                type: string
          examples: {}
      headers: {}
  schemas:
    attributes:
      type: object
      properties:
        id:
          type: integer
        attribute_group_id:
          type: integer
        name:
          type: string
        is_hidden:
          type: boolean
        sort_order:
          type: integer
        updated_at:
          type: string
        created_at:
          type: string
        page_title:
          type: string
        keywords:
          type: string
        meta_description:
          type: string
        url_rewrite:
          type: string
  securitySchemes:
    X-AC-Auth-Token:
      name: X-AC-Auth-Token
      type: apiKey
      in: header
