openapi: 3.2.0
info:
  title: Online Store Customer Association API
  version: '1.0'
  description: Online Store API
servers:
- url: https://www.yoursite.com/api/v1
  description: ''
security:
- X-AC-Auth-Token: []
tags:
- name: Customer Association
paths:
  /customer_association:
    get:
      summary: Get Customer Associations
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_count:
                    type: integer
                  customer_association:
                    type: array
                    items:
                      $ref: '#/components/schemas/customer_association'
      operationId: get-customer_association
      description: Gets an array of customer associations.
      tags:
      - Customer Association
    post:
      summary: Create a Customer Association
      operationId: post-customer_association
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customer_association'
      tags:
      - Customer Association
      description: Creates a customer association.
      requestBody:
        content:
          application/json:
            schema:
              description: ''
              type: object
              x-examples:
                example-1:
                  association_type_id: 2
                  parent_customer_id: 1
                  child_customer_id: 13
              properties:
                association_type_id:
                  type: integer
                  minLength: 1
                parent_customer_id:
                  type: integer
                child_customer_id:
                  type: integer
              required:
              - association_type_id
              - parent_customer_id
              - child_customer_id
            examples:
              Example:
                value:
                  association_type_id: 2
                  parent_customer_id: 1
                  child_customer_id: 13
  /customer_association/{id}:
    parameters:
    - schema:
        type: integer
      name: id
      in: path
      required: true
    put:
      summary: Update a Customer Association
      operationId: put-customer_association-id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customer_association'
      tags:
      - Customer Association
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/customer_association'
      description: Updates a customer association.
    delete:
      summary: Delete a Customer Association
      operationId: delete-customer_association-id
      responses:
        '200':
          description: OK
        '404':
          $ref: '#/components/responses/404'
      tags:
      - Customer Association
      description: Deletes a customer association.
components:
  responses:
    '404':
      description: Resource Not Found
      content:
        application/json:
          schema:
            description: Not Found
            type: object
            x-examples:
              example-1:
                status_code: 404
                message: Not Found
                details: No resource found
            properties:
              status_code:
                type: number
              message:
                type: string
              details:
                type: string
          examples: {}
      headers: {}
  schemas:
    customer_association:
      type: object
      properties:
        customer_association_id:
          type: integer
        association_type_id:
          type: integer
        parent_customer_id:
          type: integer
        child_customer_id:
          type: integer
  securitySchemes:
    X-AC-Auth-Token:
      name: X-AC-Auth-Token
      type: apiKey
      in: header
