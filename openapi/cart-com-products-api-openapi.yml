paths:
  /inventory:
    parameters: []
    get:
      summary: Get Inventory
      tags:
      - Products
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inventory'
      operationId: get-inventory
      parameters:
      - schema:
          type: integer
        in: query
        name: product_id
        required: true
      - schema:
          type: integer
        in: query
        name: variant_inventory_id
      - schema:
          type: string
        in: query
        name: item_number
      - schema:
          type: string
        in: query
        name: gtin
      - schema:
          type: string
        in: query
        name: item_name
      description: 'Gets current inventory of specified item in query. '
      requestBody:
        content:
          application/json:
            schema:
              description: ''
              type: object
              x-examples:
                example-1:
                  product_id: 62
                  variant_inventory_id: null
                  item_number: 60PY2DR
                  item_name: 60PY2DR
                  gtin: ''
                  quantity: 20
              properties:
                product_id:
                  type: integer
                variant_inventory_id:
                  type: integer
                item_number:
                  type: string
                  minLength: 1
                item_name:
                  type: string
                  minLength: 1
                gtin:
                  type: string
                quantity:
                  type: number
              required:
              - product_id
              - item_number
              - item_name
              - gtin
              - quantity
            examples:
              Example:
                value:
                  product_id: 62
                  variant_inventory_id: 145
                  item_number: 60PY2DR
                  item_name: 60PY2DR
                  gtin: ''
                  quantity: 20
  /products:
