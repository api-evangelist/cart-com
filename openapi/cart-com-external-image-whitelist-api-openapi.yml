openapi: 3.2.0
info:
  title: Online Store External Image Whitelist API
  version: '1.0'
  description: Online Store API
servers:
- url: https://www.yoursite.com/api/v1
  description: ''
security:
- X-AC-Auth-Token: []
tags:
- name: External Image Whitelist
paths:
  /external_image_whitelist:
    get:
      summary: Get External Image Whitelist
      tags:
      - External Image Whitelist
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_count:
                    type: integer
                  external_image_whitelist:
                    type: array
                    items:
                      $ref: '#/components/schemas/external_image_whitelist'
      operationId: get-external_image_whitelist
      description: Gets an array of external image whitelist items.
    post:
      summary: Create an External Image Whitelist Item
      operationId: post-external_image_whitelist
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/external_image_whitelist'
      tags:
      - External Image Whitelist
      description: Creates an external image whitelist item.
      requestBody:
        content:
          application/json:
            schema:
              description: ''
              type: object
              properties:
                url:
                  type: string
            examples:
              Example:
                value:
                  url: ''
  /external_image_whitelist/{id}:
    parameters:
    - schema:
        type: integer
      name: id
      in: path
      required: true
      description: The ID of the `external_image_whitelist`
    put:
      summary: Update an External Image Whitelist Item
      operationId: put-external_image_whitelist-id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/external_image_whitelist'
      tags:
      - External Image Whitelist
      description: Updates an external image whitelist item.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/external_image_whitelist'
    delete:
      summary: Delete an External Image Whitelist Item
      operationId: delete-external_image_whitelist-id
      responses:
        '200':
          description: OK
        '404':
          $ref: '#/components/responses/404'
      tags:
      - External Image Whitelist
      description: Deletes an external image whitelist item.
components:
  responses:
    '404':
      description: Resource Not Found
      content:
        application/json:
          schema:
            description: Not Found
            type: object
            x-examples:
              example-1:
                status_code: 404
                message: Not Found
                details: No resource found
            properties:
              status_code:
                type: number
              message:
                type: string
              details:
                type: string
          examples: {}
      headers: {}
  schemas:
    external_image_whitelist:
      type: object
      properties:
        external_image_whitelist_sites_id:
          type: integer
        url:
          type: string
        created_at:
          type: string
        entered_by:
          type: string
        updated_at:
          type: string
  securitySchemes:
    X-AC-Auth-Token:
      name: X-AC-Auth-Token
      type: apiKey
      in: header
