tags:
- name: Subscriptions
paths:
  /subscriptions:
    get:
      summary: Get Subscriptions
      tags:
      - Subscriptions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_count:
                    type: integer
                  subscriptions:
                    type: array
                    items:
                      $ref: '#/components/schemas/subscriptions'
      operationId: get-subscriptions
      description: Gets an aray of subscriptions.
    post:
      summary: Create a Subscription
      operationId: post-subscriptions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/subscriptions'
      description: Creates a subscription.
      tags:
      - Subscriptions
      requestBody:
        content:
          application/json:
            schema:
              description: ''
              type: object
              x-examples:
                example-1:
                  saved_cart_id: 139
                  customer_id: 18
                  next_due_at: '2022-08-01T00:00:00-05:00'
                  frequency_type: Months
                  frequency: 1
                  drip_series_id: 0
                  original_order_id: 100039
                  shipping_method_name: USPS;USPS Media Mail;USPS Media Mail
                  customer_payment_method_id: 27
                  shipping_address_id: 170
                  billing_address_id: 169
                  is_enabled: false
                  latest_renewal_order_id: null
                  is_renewal_payment_declined: false
                  renewal_count: 0
                  one_time_customer_notice: ''
                  customer_notice: ''
              properties:
                saved_cart_id:
                  type: integer
                customer_id:
                  type: integer
                next_due_at:
                  type: string
                frequency_type:
                  type: string
                frequency:
                  type: number
                drip_series_id:
                  type: integer
                original_order_id:
                  type: integer
                shipping_method_name:
                  type: string
                customer_payment_method_id:
                  type: integer
                shipping_address_id:
                  type: integer
                billing_address_id:
                  type: integer
                is_enabled:
                  type: boolean
                latest_renewal_order_id:
                  type: integer
                is_renewal_payment_declined:
                  type: boolean
                renewal_count:
                  type: number
                one_time_customer_notice:
                  type: string
                customer_notice:
                  type: string
              required:
              - customer_id
              - frequency_type
              - frequency
              - original_order_id
              - shipping_method_name
              - customer_payment_method_id
              - shipping_address_id
              - billing_address_id
            examples:
              Example:
                value:
                  saved_cart_id: 139
                  customer_id: 18
                  next_due_at: '2022-08-01T00:00:00-05:00'
                  frequency_type: Months
                  frequency: 1
                  drip_series_id: 0
                  original_order_id: 100039
                  shipping_method_name: USPS;USPS Media Mail;USPS Media Mail
                  customer_payment_method_id: 27
                  shipping_address_id: 170
                  billing_address_id: 169
                  is_enabled: false
                  latest_renewal_order_id: 245
                  is_renewal_payment_declined: false
                  renewal_count: 0
                  one_time_customer_notice: ''
                  customer_notice: ''
  /subscriptions/{id}:
    parameters:
    - schema:
        type: string
      name: id
      in: path
      required: true
      description: The ID of the `subscription`
    put:
      summary: Update a Subscription
      operationId: put-subscriptions-id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/subscriptions'
      tags:
      - Subscriptions
      description: Updates a subscription.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/subscriptions'
    delete:
      summary: Delete a Subscription
      operationId: delete-subscriptions-id
      responses:
        '200':
          description: OK
        '404':
          $ref: '#/components/responses/404'
      description: Deletes a subscription
      tags:
      - Subscriptions
