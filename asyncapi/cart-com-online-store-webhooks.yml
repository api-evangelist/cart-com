payload_notes:
- AuthorizingPayment / CapturingPayment send an `order_payment` object and expect approved,
  declined, authorization_code, transaction_id, avs_code, reject_reason, notes and
  outstanding_balance in the reply.
- CustomerCreated / CustomerUpdated / CustomerRegistered send a `customer` object;
  CustomerEmailUpdated adds old_email and new_email.
- GetDiscount sends the full cart context (ad_code, campaign_code, cart_id, customer_type,
  addresses, items with variants and custom fields, shipping method, totals) and expects
  cart_items[].discount_amount, add_items[], description[], discount and shipping_discount.
- GetPrice sends items[] (item_number, quantity, variant_ids, variant_inventory_id)
  plus customer_type_id and expects prices[] with price, cost, retail, pre_sale_cost
  and pre_sale_price.
- GetProductStatus sends items[] with product, variant_inventory and product_status
  models.

