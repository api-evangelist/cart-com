delivery:
  style: http-callback
  direction: outbound
  description: 'When the conditions for an event are met, the Online Store makes an
    HTTP request out to the subscriber URL. A subset of events are synchronous — the
    store waits for a response and uses it to change store behaviour (pricing, tax,
    discount, validation, payment authorization/capture).'
  response_timeout_seconds: 3
  response_timeout_note: Applies to events that expect a reply; the short timeout is
    deliberate because delays are user-visible in the storefront.
  response_caching:
    field: cache_length
    options:
    - {value: Short, meaning: 5 minutes}
    - {value: Long, meaning: 30 minutes}
    - {value: NoCache, meaning: do not cache the response}
  failure_handling:
    field: failure_type
    options:
    - {value: Ignore, meaning: 'disregard the failure and continue as normal (default)'}
    - {value: Error, meaning: display an error message to the user}
    - {value: Fallback, meaning: 'call the alternate URL in fallback_url'}
  signature_verification: none_documented
  retry_policy: none_documented

subscription:
  managed_by: API
  resource: /api/v1/webhooks
  scopes_required: [orders, system]
  admin_ui: /store/admin/settings/addons/webhooksubscriptionslist.aspx (version 2020.3+)
  fields:
  - {name: event_type, description: 'The webhook type, from the catalog below.'}
  - {name: url, description: The URL that receives the request when the event fires.}
  - {name: failure_type, description: 'Ignore | Error | Fallback.'}
  - {name: store_id, description: 'The store this subscription applies to; only events
      on this store trigger it.'}
  - {name: cache_length, description: 'Short | Long | NoCache.'}
  - {name: fallback_url, description: 'Called when failure_type is Fallback.'}

