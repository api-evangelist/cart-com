aid: cart-com
name: Cart.com
description: 'Cart.com is a unified commerce and logistics provider for B2C and B2B
  brands, combining an ecommerce storefront platform (the former AmeriCommerce Online
  Store), marketplace and channel management, order management, warehouse management,
  and a nationwide fulfillment network into a single operating system for commerce.
  Its developer surface is the Online Store API — a JSON REST API published as OpenAPI
  3.1 covering catalog, orders, carts, customers, content, marketing, shipping and
  store settings — plus a webhook subscription system with thirty event types, an OAuth
  2 authorization flow with coarse read/write scopes, and a client-side JavaScript
  Client API for storefront themes.'
