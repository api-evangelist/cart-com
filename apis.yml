apis:
- aid: cart-com:online-store-api
  name: Cart.com Online Store API
  description: 'The Cart.com Online Store API (formerly the AmeriCommerce REST API)
    is a JSON REST API scoped to a single merchant storefront domain. It exposes 136
    paths and 262 operations across catalog (products, variants, categories, attributes,
    inventory, pricing), orders (carts, cart items, orders, order items, payments,
    shipments, quotes, subscriptions), people (customers, addresses, profiles, users),
    content (blogs, pages, links), marketing (adcodes, coupons, discounts, gift certificates,
    mailing lists), settings (payment methods, shipping providers, tax rates, warehouses,
    store locations) and system resources. It is HTTPS-only, uses snake_case JSON,
    ISO 8601 datetimes, and a shared query syntax for filtering, paging, sorting, field
    selection and nested-resource expansion.'
  humanURL: https://developers.cart.com/docs/rest-api/ZG9jOjM2MjI2-the-online-store-api
  baseURL: https://www.americommerce.com/api/v1
  x-baseurl-note: 'The Online Store API is served from each merchant''s own storefront
    domain as https://[mystorename.com]/api/v1/. The host recorded here is Cart.com''s
    own AmeriCommerce storefront, verified live on 2026-07-31 (GET /api/v1/products
    returns 401 {"status_code":401,"message":"Unauthorized"}). The published OpenAPI
    servers[] entry is the placeholder https://www.yoursite.com/api/v1.'
  tags:
